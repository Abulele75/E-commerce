spring.application.name=e-commerce

# Server
server.port=8081

# JWT security. ECOMMERCE_JWT_SECRET must be a Base64 value that decodes to >= 32 bytes.
security.jwt.secret=${ECOMMERCE_JWT_SECRET}
security.jwt.issuer=e-commerce-api
security.jwt.expiration-seconds=3600

#Database
spring.datasource.url=jdbc:mysql://localhost:3306/ecommercedb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=tiyani

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Keep zero until the business confirms its delivery fee.
store.checkout.delivery-fee=0.00

# Use 0.00 when catalogue prices already include VAT.
# Use 0.15 only when catalogue prices are VAT-exclusive.
store.checkout.vat-rate=0.00
