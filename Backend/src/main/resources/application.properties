spring.application.name=ECommerce

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Africa/Johannesburg
spring.datasource.username=${ECOMMERCE_DB_USERNAME:root}
spring.datasource.password=${ECOMMERCE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8081

# ECOMMERCE_JWT_SECRET must be Base64 and decode to at least 32 bytes.
security.jwt.secret=${ECOMMERCE_JWT_SECRET}
security.jwt.issuer=ecommerce-api
security.jwt.expiration-seconds=3600

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep zero until the business confirms its delivery fee.
store.checkout.delivery-fee=0.00

# Use 0.00 when catalogue prices already include VAT.
# Use 0.15 only when catalogue prices are VAT-exclusive.
store.checkout.vat-rate=0.00

# Password reset tokens are single-use and expire after this many minutes.
app.password-reset.ttl-minutes=15
# Local capstone delivery channel. Set PASSWORD_RESET_EXPOSE_TOKEN=false outside local development.
app.password-reset.expose-token=${PASSWORD_RESET_EXPOSE_TOKEN:false}
